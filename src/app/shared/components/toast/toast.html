@if (notification(); as n) {
  <div class="toast-container position-fixed top-0 start-0 p-3" style="z-index: 1080;">
    <div
      class="toast show align-items-center text-bg-{{ n.type === 'success' ? 'success' : 'danger' }} border-0"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body">
          {{ n.message }}
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="dismiss()"
        ></button>
      </div>
    </div>
  </div>
}
