<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Medicines</h1>
    <a *appHasPermission="'medicines.create'" routerLink="/medicines/new" class="btn btn-primary">
      New Medicine
    </a>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Search medicines..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
      />
    </div>
    <div class="col-md-6 d-flex align-items-center">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="lowStockOnly"
          [(ngModel)]="lowStockOnly"
          (ngModelChange)="onFilterChange()"
        />
        <label class="form-check-label" for="lowStockOnly">Low stock only</label>
      </div>
    </div>
  </div>

  <app-data-table [columns]="columns" [rows]="medicines()" [loading]="loading()">
  <ng-template #actions let-medicine>
    <div class="d-flex gap-2 justify-content-end">
      <a *appHasPermission="'medicines.update'" [routerLink]="['/medicines', medicine.id]" class="btn btn-outline-secondary btn-sm">
        Edit
      </a>
      <button *appHasPermission="'medicines.stock'" type="button" class="btn btn-outline-primary btn-sm" (click)="openStockAdjust(medicine)">
        Stock
      </button>
      <button *appHasPermission="'medicines.delete'" type="button" class="btn btn-outline-danger btn-sm" (click)="deleteMedicine(medicine)">
        Delete
      </button>
    </div>
  </ng-template>
</app-data-table>

@if (stockAdjustTarget(); as m) {
  <app-stock-adjust-dialog [medicine]="m" (adjusted)="onStockAdjusted($event)" (closed)="closeStockAdjust()" />
}

  @if (totalPages() > 1) {
    <nav class="mt-3">
      <ul class="pagination justify-content-center">
        @for (p of pages(); track p) {
          <li class="page-item" [class.active]="page() === p">
            <button class="page-link" (click)="goToPage(p)">{{ p }}</button>
          </li>
        }
      </ul>
    </nav>
  }
</div>
